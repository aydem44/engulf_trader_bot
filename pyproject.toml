[project]
name = "engulf-trader-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pybit>=5.17.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[project.scripts]
engulf-trader-bot = "engulf_trader_bot:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v -ra --cov"

[tool.coverage.run]
source = ["engulf_trader_bot", "strategy", "trader", "config"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 0
